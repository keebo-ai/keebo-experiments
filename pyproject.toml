[project]
name = "keebo-experiments"
version = "0.1.0"
description = "Runnable experiments demonstrating concepts from the Keebo blog (https://keebo.ai/blog)."
authors = [{ name = "Keebo", email = "hello@keebo.ai" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<4.0"
dependencies = []

[project.urls]
Homepage = "https://keebo.ai"
Blog = "https://keebo.ai/blog"
Repository = "https://github.com/keebo-ai/keebo-experiments"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
ruff = "^0.16"
commitizen = "^4.13"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.commitizen]
# Conventional Commits + automatic version bumps, driven by CI (see
# .github/workflows/release.yml). Run `poetry run cz bump` locally to:
#   1. Read commit messages since the last tag
#   2. Pick patch/minor/major from `fix:` / `feat:` / `BREAKING CHANGE:`
#   3. Update the version in pyproject.toml ([project].version, PEP 621)
#   4. Update CHANGELOG.md
#   5. Commit + create a `v<version>` git tag
# After: `git push --follow-tags`.
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
