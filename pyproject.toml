[project]
name = "keebo-experiments"
version = "0.2.0"
description = "Runnable experiments demonstrating concepts from the Keebo blog (https://keebo.ai/blog)."
authors = [{ name = "Keebo", email = "hello@keebo.ai" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<4.0"
dependencies = [
    "click>=8.1",
    # secure-local-storage pulls in keyring so the connector can cache SSO/MFA
    # tokens — one approval per session instead of a prompt on every connect.
    "snowflake-connector-python[secure-local-storage]>=3.12",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://keebo.ai"
Blog = "https://keebo.ai/blog"
Repository = "https://github.com/keebo-ai/keebo-experiments"

# One console script mounts every experiment as a subcommand (see common/cli.py):
#   poetry run keebo-experiments <experiment> [options]
[project.scripts]
keebo-experiments = "common.cli:cli"

[tool.poetry]
# Installable so the console scripts above are created. `common/` holds shared
# helpers; `experiments/` holds one importable package per experiment.
packages = [
    { include = "common" },
    { include = "experiments" },
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
ruff = "^0.16"
commitizen = "^4.13"
mockito = "^1.5"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tests re-import fixtures and shadow names freely.
"tests/**/*.py" = ["F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import tests by path (mirrored tree has duplicate basenames) and put the repo
# root on sys.path so `import common` / `import experiments` resolve.
addopts = "--import-mode=importlib"
pythonpath = ["."]

[tool.commitizen]
# Conventional Commits + automatic version bumps, driven by CI (see
# .github/workflows/release.yml). Run `poetry run cz bump` locally to:
#   1. Read commit messages since the last tag
#   2. Pick patch/minor/major from `fix:` / `feat:` / `BREAKING CHANGE:`
#   3. Update the version in pyproject.toml ([project].version, PEP 621)
#   4. Update CHANGELOG.md
#   5. Commit + create a `v<version>` git tag
# After: `git push --follow-tags`.
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
