name: PR checks

# Lint, format-check, and test on every PR and on pushes to main. This is the
# quality gate for incoming experiment PRs: it must be green before merge.
#
# It mirrors the local gate exactly, so `poetry run ruff check .`,
# `poetry run ruff format --check .`, and `poetry run pytest` passing locally
# means CI passes too.

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ruff + pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Keep CI on the same interpreter the repo pins locally.
          python-version-file: .python-version

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        # Installs the project + dev group (ruff, pytest, ...) into the venv.
        run: poetry install

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Ruff format check
        run: poetry run ruff format --check .

      - name: Pytest
        run: poetry run pytest
