name: Release

# Auto-bump the version on every push to main using commitizen. Reads
# Conventional Commits in the new commits and:
#   - patches:  fix:
#   - minors:   feat:
#   - majors:   any commit with `BREAKING CHANGE:` in the body
# Anything else (chore:, docs:, refactor:, etc.) does NOT trigger a release,
# so doc-only or refactor merges land cleanly without producing tags.
#
# If main is protected (PR-required), the workflow can't push the bump commit
# directly, so it works in two stages:
#
#   1. open-release-pr — runs on a non-bump push. Computes the bump locally,
#      force-pushes a `release/auto` branch, and opens (or updates) a PR
#      against main. That PR goes through review like any other change.
#      Runs are serialized, a run whose push is no longer main's tip exits (a
#      newer run decides), and when there's nothing to release any leftover
#      release PR is closed as stale.
#   2. tag-release — runs on every push to main. Idempotent: reads the
#      version from pyproject.toml and creates the matching tag (+ GitHub
#      Release) if it doesn't already exist. On the push that lands the bump
#      PR this is what stamps the release.
#
# When commits since the last tag don't include a fix/feat/breaking-change,
# commitizen-action exits 21 and `no_raise: 21` lets the workflow succeed
# without opening a PR.
#
# NOTE: `open-release-pr` uses `gh pr create` with the default GITHUB_TOKEN,
# which requires "Allow GitHub Actions to create and approve pull requests"
# to be enabled in the repo's Settings → Actions → General.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  open-release-pr:
    name: Open release PR
    runs-on: ubuntu-latest
    # Skip on the push that merges the release PR itself — its message
    # always starts with "bump:" because the PR title is "bump: version vX.Y.Z".
    if: ${{ !startsWith(github.event.head_commit.message, 'bump:') }}
    # One release-PR run at a time. Overlapping runs once raced: a slower run
    # opened a second "bump: version v0.4.0" PR (#23) seconds after the real one
    # (#22) had merged. Queued runs wait instead of racing (a newer queued run
    # replaces an older one that hasn't started).
    concurrency:
      group: open-release-pr
      cancel-in-progress: false

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # commitizen needs full history to find the last tag.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump locally (no push)
        id: bump
        uses: commitizen-tools/commitizen-action@0.27.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          push: false
          # Pin to the same commitizen major we use locally.
          commitizen_version: 4.13.10
          # Exit 21 = "no version-bumping commits since last tag". Treat as
          # success rather than failure so the workflow no-ops cleanly.
          no_raise: "21"

      - name: Push release branch and open, update, or close the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          branch='release/auto'

          # If main has moved on since this run was triggered, a newer run owns
          # the release decision. Acting on this stale checkout could reopen a
          # PR for a version that has already shipped.
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "${{ github.sha }}" ]; then
            echo "main has moved past ${{ github.sha }}; leaving the release to the newer run."
            exit 0
          fi

          open_pr=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // ""')

          # commitizen-action with `no_raise: 21` swallows the "nothing to bump"
          # exit but can still report outputs.version as the CURRENT version, so
          # a version alone doesn't mean there's a bump. No bump commit means HEAD
          # is still the triggering commit: nothing to release. Skip cleanly
          # instead of force-pushing an empty release/auto and failing
          # `gh pr create` with "No commits between main and release/auto".
          if [ -z "${NEW_VERSION}" ] || [ "$(git rev-parse HEAD)" = "${{ github.sha }}" ]; then
            echo "commitizen made no bump commit; nothing to release."
            # With no unreleased feat/fix commits on main, any open release PR is
            # stale (its version already shipped), so close it rather than let it
            # sit and drift into conflicts.
            if [ -n "$open_pr" ]; then
              gh pr close "$open_pr" --delete-branch --comment \
                "Closing: main has no unreleased feat/fix commits, so this release PR is stale. The release workflow opens a fresh one on the next releasable merge."
            fi
            exit 0
          fi

          # The action created a local v$NEW_VERSION tag pointing at the bump
          # commit on this throwaway checkout. Drop it so tag-release can
          # re-create it cleanly against the real merge commit on main.
          git tag -d "v${NEW_VERSION}" || true

          git checkout -B "$branch"
          git push -f origin "$branch"

          title="bump: version v${NEW_VERSION}"
          body="Automated version bump to v${NEW_VERSION}. Merging this PR will create the v${NEW_VERSION} git tag. Generated by .github/workflows/release.yml."

          # If a release PR is already open against this branch, update it in
          # place so the title and changelog reflect the latest bump.
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "$title" --body "$body"
          fi

  tag-release:
    name: Tag release
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag if pyproject.toml version has no tag yet, then publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v=$(awk -F\" '/^version = "/ { print $2; exit }' pyproject.toml)
          if [ -z "$v" ]; then
            echo "Could not parse version from pyproject.toml" >&2
            exit 1
          fi
          tag="v$v"

          if git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            tag_sha=$(git rev-parse "${tag}^{commit}")
            # The tag must point to a commit reachable from main; otherwise it's
            # an orphan from a previous failed release and a human needs to clean
            # it up before we can re-stamp this version.
            if git merge-base --is-ancestor "$tag_sha" HEAD; then
              echo "Tag $tag already exists on main; nothing to do."
              exit 0
            fi
            echo "::error::Tag $tag exists at $tag_sha which is not reachable from main. Likely an orphan from a prior failed release. Delete it (git push --delete origin $tag) and re-run." >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"

          # A tag pushed with the default GITHUB_TOKEN does NOT trigger a separate
          # `on: push: tags` workflow (GitHub's loop-prevention), so we create the
          # GitHub Release here, in the same job that creates the tag.
          gh release create "$tag" --title "$tag" --generate-notes
