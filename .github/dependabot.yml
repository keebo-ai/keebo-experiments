version: 2
updates:
  # Python dependencies managed by Poetry (pyproject.toml + poetry.lock).
  #
  # Every update is grouped into ONE weekly PR. Separate PRs all rewrite
  # poetry.lock, so merging one leaves the rest conflicted and waiting on a
  # Dependabot rebase; a single grouped PR avoids that churn.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # Keep the GitHub Actions used in our workflows up to date, also as one PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
